spring:
  datasource:
    # Railway PostgreSQL: set DATABASE_URL = jdbc:postgresql://${{Postgres.PGHOST}}:${{Postgres.PGPORT}}/${{Postgres.PGDATABASE}}?options=-c%20TimeZone%3DUTC
    url: ${DATABASE_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      connection-timeout: 30000
  jpa:
    show-sql: false
  data:
    redis:
      url: ${REDIS_URL}
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    user:
      name: ignored
      password: ignored
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

jwt:
  secret: ${JWT_SECRET}
  access-token-expiry-ms: ${JWT_ACCESS_TOKEN_EXPIRY_MS:900000}
  refresh-token-expiry-days: ${JWT_REFRESH_TOKEN_EXPIRY_DAYS:7}

app:
  cors:
    allowed-origins: ${FRONTEND_URL}
  security:
    cookie-secure: true
  frontend-url: ${FRONTEND_URL}
  mail:
    from: ${MAIL_FROM}
    from-name: ${MAIL_FROM_NAME:unity_skill}

server:
  port: ${PORT:8080}

logging:
  level:
    root: WARN
    com.unityskill: INFO

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

google:
  client-id: ${GOOGLE_CLIENT_ID}
  client-secret: ${GOOGLE_CLIENT_SECRET}
  redirect-uri: ${GOOGLE_REDIRECT_URI}
  frontend-redirect-base-url: ${FRONTEND_URL}

github:
  client-id: ${GITHUB_CLIENT_ID}
  client-secret: ${GITHUB_CLIENT_SECRET}
  redirect-uri: ${GITHUB_REDIRECT_URI}
  login-client-id: ${GITHUB_LOGIN_CLIENT_ID}
  login-client-secret: ${GITHUB_LOGIN_CLIENT_SECRET}
  login-redirect-uri: ${GITHUB_LOGIN_REDIRECT_URI}
  webhook-endpoint-url: ${GITHUB_WEBHOOK_ENDPOINT_URL}
  frontend-redirect-base-url: ${FRONTEND_URL}

auth:
  cookie-secure: true

encryption:
  secret: ${ENCRYPTION_SECRET}
  salt: ${ENCRYPTION_SALT}

ai:
  provider: ${AI_PROVIDER:gemini}
  gemini:
    api-key: ${GEMINI_API_KEY}
    model: ${GEMINI_MODEL:gemini-2.0-flash}
  anthropic:
    api-key: ${ANTHROPIC_API_KEY:}
    model: ${ANTHROPIC_MODEL:claude-3-5-sonnet-20241022}
