spring:
  datasource:
    url: ${DATABASE_URL}        # Supabase: jdbc:postgresql://db.xxx.supabase.co:5432/postgres
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5       # Supabase free tier connection limit
      connection-timeout: 30000
      connection-init-sql: SET TimeZone='UTC'
  data:
    redis:
      url: ${REDIS_URL}          # Upstash: rediss://default:xxx@xxx.upstash.io:6380
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    user:
      name: ignored
      password: ignored

jwt:
  secret: ${JWT_SECRET}
  access-token-expiry-ms: 900000
  refresh-token-expiry-days: 7

app:
  cors:
    allowed-origins: ${FRONTEND_URL:https://unity-skill.vercel.app}
  security:
    cookie-secure: true          # HTTPS in production
  frontend-url: ${FRONTEND_URL:https://unity-skill.vercel.app}

management:
  endpoints:
    web:
      exposure:
        include: health          # Only health exposed in prod (not info)
  endpoint:
    health:
      show-details: never        # Don't leak DB/Redis details in prod

server:
  port: ${PORT:8080}            # Render sets $PORT automatically

logging:
  level:
    root: WARN
    com.unityskill: INFO
